plugins {
    id 'com.android.application'
}

android {
    namespace 'com.audilarm'
    compileSdk 34

    defaultConfig {
        applicationId 'com.audilarm'
        minSdk 24
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
}
